
<style>
.sidebar {
  background: #2d2d2d;
  width: 260px;
  font-family: var(--font-sans);
  border-radius: var(--border-radius-lg);
  overflow: hidden;
  user-select: none;
}
.sidebar-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  color: #e0e0e0;
  font-size: 15px;
  cursor: pointer;
  border-bottom: 0.5px solid rgba(255,255,255,0.06);
  transition: background 0.15s;
}
.sidebar-item:hover { background: rgba(255,255,255,0.07); }
.sidebar-item.active { color: #f5a623; font-weight: 500; border-left: 3px solid #f5a623; padding-left: 17px; }
.sidebar-item .chevron { color: #aaa; font-size: 13px; transition: transform 0.2s; }
.sidebar-item.open .chevron { transform: rotate(180deg); }
.badge-live {
  background: #f5a623;
  color: #1a1a1a;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 3px;
  letter-spacing: 0.5px;
  margin-left: 8px;
  text-transform: uppercase;
}
.submenu {
  background: #252525;
  display: none;
}
.submenu.open { display: block; }
.submenu-item {
  padding: 10px 20px 10px 32px;
  color: #bbb;
  font-size: 14px;
  cursor: pointer;
  border-bottom: 0.5px solid rgba(255,255,255,0.04);
}
.submenu-item:hover { background: rgba(255,255,255,0.05); color: #e0e0e0; }
.sidebar-divider { border: none; border-top: 0.5px solid rgba(255,255,255,0.1); margin: 8px 0; }
.icon-badge { margin-left: 6px; font-size: 15px; vertical-align: -2px; }
</style>

<div style="padding: 1.5rem 0; display: flex; justify-content: center; background: transparent;">
  <div class="sidebar">
    <div class="sidebar-item active">
      <span>Flight tracker map <span class="badge-live">live</span></span>
    </div>

    <div class="sidebar-item" onclick="toggle(this, 'aviation-sub')">
      <span>Aviation data</span>
      <span class="chevron"><i class="ti ti-chevron-down" aria-hidden="true"></i></span>
    </div>
    <div id="aviation-sub" class="submenu">
      <div class="submenu-item">Airlines</div>
      <div class="submenu-item">Airports</div>
      <div class="submenu-item">Aircraft</div>
    </div>

    <div class="sidebar-item">
      <span>Email alerts <i class="ti ti-lock icon-badge" style="color:#f5a623" aria-hidden="true"></i></span>
    </div>

    <div class="sidebar-item">
      <span>Subscription plans <i class="ti ti-trophy icon-badge" style="color:#2ecc71" aria-hidden="true"></i></span>
    </div>

    <div class="sidebar-item" onclick="toggle(this, 'coverage-sub')">
      <span>Add coverage</span>
      <span class="chevron"><i class="ti ti-chevron-down" aria-hidden="true"></i></span>
    </div>
    <div id="coverage-sub" class="submenu">
      <div class="submenu-item">By region</div>
      <div class="submenu-item">By airport</div>
    </div>

    <div class="sidebar-item" onclick="toggle(this, 'api-sub')">
      <span>Commercial services & API</span>
      <span class="chevron"><i class="ti ti-chevron-down" aria-hidden="true"></i></span>
    </div>
    <div id="api-sub" class="submenu">
      <div class="submenu-item">API documentation</div>
      <div class="submenu-item">Pricing</div>
      <div class="submenu-item">Contact sales</div>
    </div>

    <div class="sidebar-item">Press & media center</div>

    <div class="sidebar-item" onclick="toggle(this, 'about-sub')">
      <span>About</span>
      <span class="chevron"><i class="ti ti-chevron-down" aria-hidden="true"></i></span>
    </div>
    <div id="about-sub" class="submenu">
      <div class="submenu-item">Our team</div>
      <div class="submenu-item">Careers</div>
    </div>

    <hr class="sidebar-divider">

    <div class="sidebar-item">MyFR24 – flight logbook</div>
    <div class="sidebar-item">JetPhotos – aviation photos</div>
    <div class="sidebar-item" style="border-bottom: none;">Forum</div>
  </div>
</div>

<script>
function toggle(el, subId) {
  const sub = document.getElementById(subId);
  const isOpen = sub.classList.contains('open');
  document.querySelectorAll('.submenu').forEach(s => s.classList.remove('open'));
  document.querySelectorAll('.sidebar-item').forEach(s => s.classList.remove('open'));
  if (!isOpen) { sub.classList.add('open'); el.classList.add('open'); }
}
</script>
